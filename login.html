<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — CampusFunda</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="assets/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="cf-header"></div>
    <section
      class="cf-section"
      style="min-height: 70vh; display: flex; align-items: center"
    >
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-5">
            <div class="cf-form-wrap">
              <span class="section-eyebrow">Welcome back</span>
              <h2 class="mb-1">Log in to CampusFunda</h2>
              <p style="color: var(--cf-muted)">
                Pick up exactly where you left off.
              </p>
              <form
                onsubmit="
                  event.preventDefault();
                  alert('Demo form — connect to backend to enable login.');
                "
                data-testid="login-form"
              >
                <div class="mb-3">
                  <label>Email or mobile</label
                  ><input
                    class="form-control"
                    required
                    data-testid="login-email"
                  />
                </div>
                <div class="mb-3">
                  <label>Password</label
                  ><input
                    type="password"
                    class="form-control"
                    required
                    data-testid="login-password"
                  />
                </div>
                <div
                  class="d-flex justify-content-between align-items-center mb-3"
                >
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="remember"
                    /><label
                      for="remember"
                      class="form-check-label"
                      style="font-size: 14px"
                      >Remember me</label
                    >
                  </div>
                  <a href="#" style="font-size: 14px">Forgot password?</a>
                </div>
                <button
                  class="btn-cf btn-cf-lime w-100 justify-content-center"
                  data-testid="login-submit-btn"
                >
                  Log in <i class="bi bi-arrow-right"></i>
                </button>
              </form>
              <div
                class="text-center my-3"
                style="color: var(--cf-muted); font-size: 13px"
              >
                or continue with
              </div>
              <div class="d-flex gap-2">
                <button
                  class="btn-cf btn-cf-ghost w-100 justify-content-center"
                >
                  <i class="bi bi-google"></i> Google
                </button>
                <button
                  class="btn-cf btn-cf-ghost w-100 justify-content-center"
                >
                  <i class="bi bi-facebook"></i> Facebook
                </button>
              </div>
              <div
                class="text-center mt-4"
                style="color: var(--cf-muted); font-size: 14px"
              >
                New to CampusFunda?
                <a href="register.html">Create an account</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div id="cf-footer"></div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/partials.js"></script>
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516"
      integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg=="
      data-cf-beacon='{"version":"2024.11.0","token":"7f7b0fd8732c4326aae4b9d58d5c514a","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}'
      crossorigin="anonymous"
    ></script>
  </body>
</html>
