<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Publishers — CampusFunda</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="assets/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="cf-header"></div>
    <section class="cf-section" style="padding: 50px 0 30px">
      <div class="container">
        <div class="cf-breadcrumb">
          <a href="index.html">Home</a> › <span>Publishers</span>
        </div>
        <span class="section-eyebrow">Explore</span>
        <h1 class="section-title mb-4">
          Trusted <span class="serif-accent">publishers</span> on CampusFunda
        </h1>
        <p style="color: var(--cf-muted); max-width: 620px">
          We partner with the most reliable names in Indian academic publishing,
          so every title you find here is classroom-tested.
        </p>

        <div class="row g-4 mt-4" id="pubGrid"></div>
      </div>
    </section>
    <div id="cf-footer"></div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/partials.js"></script>
    <script>
      const pubs = [
        {
          n: "Techknowledge Publication",
          b: "150+ titles",
          c: "Engineering",
          col: "#ff6b4a",
        },
        {
          n: "IDOL Publication",
          b: "92 titles",
          c: "Commerce & Arts",
          col: "#d7ff3a",
        },
        {
          n: "Campus Funda",
          b: "210 titles",
          c: "Multi-discipline",
          col: "#13294b",
        },
        {
          n: "Nirali Prakashan",
          b: "78 titles",
          c: "Engineering",
          col: "#ece6d6",
        },
        {
          n: "Pragati Publication",
          b: "64 titles",
          c: "Science",
          col: "#ff6b4a",
        },
        {
          n: "Dreamtech Press",
          b: "120 titles",
          c: "Computer Science",
          col: "#d7ff3a",
        },
      ];
      document.getElementById("pubGrid").innerHTML = pubs
        .map(
          (p) => `
      <div class="col-md-6 col-lg-4">
        <a href="search.html" class="cf-cat-card d-block text-decoration-none">
          <div class="icon-box" style="background:${p.col};color:${p.col === "#d7ff3a" || p.col === "#ece6d6" ? "#0b1f3a" : "#fff"}"><i class="bi bi-buildings"></i></div>
          <div><h4>${p.n}</h4><p>${p.b} across ${p.c}</p></div>
          <div class="go">View catalogue <i class="bi bi-arrow-right"></i></div>
        </a>
      </div>`,
        )
        .join("");
    </script>
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516"
      integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg=="
      data-cf-beacon='{"version":"2024.11.0","token":"7f7b0fd8732c4326aae4b9d58d5c514a","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}'
      crossorigin="anonymous"
    ></script>
  </body>
</html>
