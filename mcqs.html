<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Practice MCQs — CampusFunda</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="assets/style.css" rel="stylesheet" />
  </head>
  <body data-page="mcqs">
    <div id="cf-header"></div>

    <section class="cf-section" style="padding: 50px 0 30px">
      <div class="container">
        <div class="cf-breadcrumb">
          <a href="index.html">Home</a> › <span>MCQs</span>
        </div>
        <div class="row align-items-end g-3 mb-5">
          <div class="col-lg-8">
            <span class="section-eyebrow">Practice zone</span>
            <h1 class="section-title">
              Drill it. <span class="serif-accent">Nail</span> it.
            </h1>
            <p style="color: var(--cf-muted)">
              Chapter-wise multiple choice questions with instant explanations.
              Perfect for last-mile revision.
            </p>
          </div>
          <div class="col-lg-4 text-lg-end">
            <a href="search.html" class="btn-cf btn-cf-ghost">Browse ebooks</a>
          </div>
        </div>

        <div class="d-flex gap-2 flex-wrap mb-4">
          <span class="cf-chip active">All</span>
          <span class="cf-chip">Computer Engg.</span>
          <span class="cf-chip">Mechanical</span>
          <span class="cf-chip">Electrical</span>
          <span class="cf-chip">Electronics</span>
          <span class="cf-chip">Civil</span>
          <span class="cf-chip">First Year</span>
        </div>

        <div class="row g-4" id="mcq-grid"></div>
      </div>
    </section>

    <div id="cf-footer"></div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/partials.js"></script>
    <script>
      const mcqs = [
        {
          t: "Embedded & Real Time OS",
          a: "Harish G. Narula",
          c: "CS",
          p: 35,
          w: 40,
          q: 120,
          img: "https://techknowledgebooks.com/wp-content/uploads/2022/02/Embedded-Systems-and-Real-Time-Operating-Systems-ME200B-scaled.jpg",
        },
        {
          t: "Industrial Engineering (Elective)",
          a: "Anand Bewoor",
          c: "Mech",
          p: 35,
          w: 40,
          q: 85,
          img: "https://techknowledgebooks.com/wp-content/uploads/2024/01/Industrial-EngineeringPO234B-scaled.jpg",
        },
        {
          t: "High Performance Computing",
          a: "H.G. Narula, M. Shetty",
          c: "CS",
          p: 35,
          w: 40,
          q: 140,
          img: "https://techknowledgebooks.com/wp-content/uploads/2024/01/High-Performance-Computing-PE179A-scaled.jpg",
        },
        {
          t: "Information Storage & Retrieval",
          a: "Kavita Sultanpure",
          c: "IT",
          p: 35,
          w: 50,
          q: 95,
          img: "https://techknowledgebooks.com/wp-content/uploads/2024/01/Information-Storage-and-Retrieval-PO217B.jpg",
        },
        {
          t: "Database Management Systems",
          a: "Mahesh Mali",
          c: "IT",
          p: 40,
          w: 55,
          q: 180,
          img: "https://techknowledgebooks.com/wp-content/uploads/2020/07/Database-Management-System-1-scaled.jpg",
        },
        {
          t: "Theory of Computation",
          a: "D.K. Sultania",
          c: "CS",
          p: 40,
          w: 55,
          q: 150,
          img: "https://techknowledgebooks.com/wp-content/uploads/2024/01/Theory-of-Computation-PO152C.jpg",
        },
        {
          t: "Microcontroller 8051",
          a: "H.G. Narula",
          c: "ECE",
          p: 35,
          w: 45,
          q: 110,
          img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_pBj6V8occSYlgQ0HEGEvt4GrYLj_F8VQtw&s",
        },
        {
          t: "Operating Systems",
          a: "R. Kulkarni",
          c: "CS",
          p: 35,
          w: 50,
          q: 200,
          img: "https://techknowledgebooks.com/wp-content/uploads/2024/01/Operating-Systems-PO153C-scaled.jpg",
        },
      ];
      document.getElementById("mcq-grid").innerHTML = mcqs
        .map(
          (m) => `
      <div class="col-6 col-md-4 col-lg-3">
        <a href="book-detail.html" class="cf-book-card d-block text-decoration-none">
          <div class="cf-book-cover"><span class="tag">${m.q} Qs</span>
            <img src="${m.img}" alt="${m.t}" class="cf-book-img" /></div>
          <div class="cf-book-body">
            <span class="cf-book-cat">${m.c}</span>
            <h5 class="cf-book-title">${m.t}</h5>
            <span class="cf-book-author">${m.a}</span>
            <div class="cf-book-price"><span class="now">₹${m.p}</span><span class="was">₹${m.w}</span></div>
          </div>
        </a>
      </div>`,
        )
        .join("");
    </script>

      defer
      src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516"

      crossorigin="anonymous"
    ></script>
  </body>
</html>
